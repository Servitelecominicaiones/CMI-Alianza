# ---------------------------------------------------------------------------
# CMI Alianza — Stack para desplegar en el servidor con Portainer CE
# (stack desde Git, "Compose path": docker-compose.portainer.yml).
# Para desarrollo local se sigue usando docker-compose.yml / docker-compose.local.yml.
# ---------------------------------------------------------------------------
# Diferencias con docker-compose.yml:
# - `pull_policy: build` en las imágenes propias (app, nginx): evita que Portainer
#   intente DESCARGAR `cmi_app`/`cmi_nginx` de un registro (de ahí el error
#   "pull access denied for cmi_app"). Con "Pull and redeploy" se reconstruyen.
# - SIN bind mounts del repo (`.:/var/www`): Portainer clona el repo dentro de su
#   propio contenedor, así que esa ruta no existe en el host y Docker montaría
#   carpetas vacías sobre el código. El código sale de la imagen (COPY . .).
# - Las variables NO salen de un `.env` (no existe al clonar por Git) sino de las
#   "Environment variables" del stack (Portainer > Stack > Environment).
# - Datos persistentes (MySQL, documentos, storage) en volúmenes con nombre.
# - Entrada pública por el Traefik del servidor (red externa net_proxy, TLS en
#   Traefik, entrypoint websecure). Router/servicio `cmi` para no chocar con
#   otros stacks del mismo Traefik.
#
# Variables del stack (Portainer > Stack > Environment):
#   APP_KEY            OBLIGATORIA  -> `php artisan key:generate --show`
#   DB_PASSWORD        OBLIGATORIA
#   DB_ROOT_PASSWORD   OBLIGATORIA
#   APP_HOST           (por defecto cmi-dev.servitel.co)
#   APP_URL            (por defecto https://cmi-dev.servitel.co)
#   APP_ENV, APP_DEBUG, APP_LOCALE, LOG_LEVEL   (opcionales; defaults dev)
#   DB_DATABASE, DB_USERNAME                    (por defecto cmi / cmi)
#   TRAEFIK_ENTRYPOINT (por defecto websecure)
#
# La red externa net_proxy la crea Traefik; debe existir antes del despliegue.
# ---------------------------------------------------------------------------

name: cmi-alianza

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: cmi-app
    restart: unless-stopped
    working_dir: /var/www
    # Config de Laravel por entorno (Portainer las inyecta). Las marcadas con
    # :? fallan con un mensaje claro si no se definen.
    environment:
      APP_NAME: ${APP_NAME:-CMI Alianza}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:?falta APP_KEY en las variables del stack}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-https://cmi-dev.servitel.co}
      APP_LOCALE: ${APP_LOCALE:-es}
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-cmi}
      DB_USERNAME: ${DB_USERNAME:-cmi}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en las variables del stack}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      BROADCAST_CONNECTION: log
      MAIL_MAILER: log
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }
    volumes:
      - cmi-storage:/var/www/storage/app
      - cmi-bodega:/var/www/public/bodega_documental
    networks: [red]
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    pull_policy: build
    container_name: cmi-nginx
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }
    # Mismo volumen de documentos que `app` para poder servirlos como estáticos.
    volumes:
      - cmi-bodega:/var/www/public/bodega_documental
    networks: [red, net_proxy]
    depends_on: [app]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=net_proxy"
      - "traefik.http.routers.cmi.rule=Host(`${APP_HOST:-cmi-dev.servitel.co}`)"
      - "traefik.http.routers.cmi.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.cmi.tls=true"
      # Descomenta si Traefik emite certificados con un resolver (Let's Encrypt):
      # - "traefik.http.routers.cmi.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}"
      - "traefik.http.services.cmi.loadbalancer.server.port=80"

  mysql:
    image: mysql:8.0
    container_name: cmi-mysql
    restart: unless-stopped
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "3" }
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cmi}
      MYSQL_USER: ${DB_USERNAME:-cmi}
      MYSQL_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en las variables del stack}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD en las variables del stack}
      TZ: America/Bogota
    command: >-
      --default-time-zone=-05:00
      --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - cmi-mysql-data:/var/lib/mysql
    networks: [red]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s

# ---------------------------------------------------------------------------
# Redes
#   red       -> privada del stack (app <-> nginx <-> mysql).
#   net_proxy -> red EXTERNA del Traefik del servidor (no la crea este stack).
# ---------------------------------------------------------------------------
networks:
  red:
    name: cmi-red
  net_proxy:
    external: true

volumes:
  cmi-mysql-data:
    name: cmi-mysql-data
  cmi-storage:
    name: cmi-storage
  cmi-bodega:
    name: cmi-bodega
