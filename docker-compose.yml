services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cminuevo
    container_name: cmi_app
    restart: unless-stopped
    working_dir: /var/www
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    volumes:
      - .:/var/www
      - /data/cmi_storage:/var/www/storage/app
      - /data:/var/www/public/Documentos
    networks:
      - cmi_network

  nginx:
    image: nginx:alpine
    container_name: cmi_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - .:/var/www
      - /data/cmi_storage:/var/www/storage/app
      - /data:/var/www/public/Documentos
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - cmi_network

  mysql:
    image: mysql:8.0
    container_name: cmi_mysql
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - /data/cmi_mysql:/var/lib/mysql
    networks:
      - cmi_network

networks:
  cmi_network:
    driver: bridge
